<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Biểu mẫu đăng nhập</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome có sẵn trong ex3 -->
    <link
        rel="stylesheet"
        href="css/all.min.css"
    >
</head>

<body class="bg-light">
        <!-- ===================================================== -->
    <!-- 4. MỞ BIỂU MẪU ĐĂNG NHẬP -->
    <!-- ===================================================== -->

    <div class="container mt-5 mb-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8">

                <div class="border border-danger bg-white p-3">

                    <h1 class="display-6 mb-4">
                        Mở biểu mẫu đăng nhập
                    </h1>

                    <button
                        type="button"
                        class="btn btn-info btn-lg text-white"
                        data-bs-toggle="modal"
                        data-bs-target="#loginModal"
                    >
                        Mở hộp thoại
                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- ===================================================== -->
    <!-- LOGIN MODAL -->
    <!-- ===================================================== -->

    <div
        class="modal fade"
        id="loginModal"
        tabindex="-1"
        aria-labelledby="loginModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">


                <!-- HEADER -->
                <div class="modal-header">

                    <h2
                        class="modal-title w-100 text-center"
                        id="loginModalLabel"
                    >

                        <i class="fas fa-lock"></i>

                        Đăng nhập

                    </h2>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>



                <!-- BODY -->
                <div class="modal-body">

                    <form>


                        <!-- Người dùng -->
                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                <i class="fas fa-user"></i>

                                Người dùng:

                            </label>

                            <input
                                type="text"
                                class="form-control form-control-lg"
                                placeholder="Nhập tên người dùng"
                            >

                        </div>



                        <!-- Mật khẩu -->
                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                <i class="fas fa-eye"></i>

                                Mật khẩu:

                            </label>

                            <input
                                type="password"
                                class="form-control form-control-lg"
                                placeholder="Nhập mật khẩu"
                            >

                        </div>



                        <!-- Ghi nhớ -->
                        <div class="mb-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="rememberModal"
                                >

                                <label
                                    class="form-check-label fw-bold"
                                    for="rememberModal"
                                >
                                    Ghi nhớ tôi
                                </label>

                            </div>

                        </div>



                        <!-- Đăng nhập -->
                        <button
                            type="submit"
                            class="btn btn-success btn-lg w-100"
                        >

                            <i class="fas fa-power-off"></i>

                            Đăng nhập

                        </button>

                    </form>

                </div>



                <!-- FOOTER -->
                <div class="modal-footer justify-content-between">


                    <!-- Hủy bỏ -->
                    <button
                        type="button"
                        class="btn btn-danger btn-lg"
                        data-bs-dismiss="modal"
                    >

                        <i class="fas fa-xmark"></i>

                        Hủy bỏ

                    </button>



                    <!-- Đăng ký / Quên mật khẩu -->
                    <div class="text-end">

                        <p class="mb-2">

                            Bạn chưa phải là thành viên?

                            <a href="#">
                                Đăng ký
                            </a>

                        </p>

                        <a href="#">
                            Quên mật khẩu?
                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>



    <!-- ===================================================== -->
    <!-- BOOTSTRAP JAVASCRIPT -->
    <!-- ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>
</html>
