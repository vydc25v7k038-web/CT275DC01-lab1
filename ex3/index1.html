<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Biểu mẫu đăng nhập</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/all.min.css"
    >
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-11 col-sm-9 col-md-7 col-lg-6">

            <div class="border border-info rounded-4 bg-white shadow-sm">

                <div class="bg-info-subtle text-info-emphasis p-3 rounded-top-4">

                    <h6 class="mb-0 fw-bold">
                        Biểu mẫu đăng nhập
                    </h6>

                </div>

                <div class="p-4">

                    <form>

                        <div class="row mb-3 align-items-center">

                            <label
                                class="col-sm-4 col-form-label fw-bold"
                            >
                                Email:
                            </label>

                            <div class="col-sm-8">

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Nhập vào email"
                                >

                            </div>

                        </div>

                        <div class="row mb-3 align-items-center">

                            <label
                                class="col-sm-4 col-form-label fw-bold"
                            >
                                Mật khẩu:
                            </label>

                            <div class="col-sm-8">

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Nhập vào mật khẩu"
                                >

                            </div>

                        </div>

                        <div class="row mb-3">

                            <div class="col-sm-8 offset-sm-4">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="rememberHorizontal"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="rememberHorizontal"
                                    >
                                        Ghi nhớ tôi
                                    </label>

                                </div>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-sm-8 offset-sm-4">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Đăng nhập
                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
</body>
</html>
